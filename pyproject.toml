[project]
name = "jan-setu"
version = "0.1.0"
description = "Complaint Aggregator Platform to route complaints to designated departments easily and efficiently."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"alembic>=1.14.0",
	"asyncpg>=0.30.0",
	"fastapi[standard]>=0.115.6",
	"httpx>=0.28.1",
	"pydantic-settings>=2.7.0",
	"sqlalchemy[asyncio]>=2.0.36",
]

[project.scripts]
jan-setu-api = "jan_setu.main:run"
jan-setu-worker = "jan_setu.worker:run"

[dependency-groups]
dev = [
	"pre-commit>=4.0.0",
	"pytest>=8.3.4",
	"ruff>=0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jan_setu"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
