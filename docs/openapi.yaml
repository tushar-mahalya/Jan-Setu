      - role
      - department_keys
  securitySchemes:
    citizenBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from /auth/status or /auth/refresh, sent as `Authorization: Bearer <token>`.'
    officialBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /api/official/auth/verify, audience-scoped separately from citizen
        tokens.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Static internal API key for /v1/contacts and /v1/messages*, set via the API_KEY setting.
    metaWebhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: HMAC-SHA256 of the raw request body, signed by Meta with WHATSAPP_APP_SECRET. Not caller-supplied.
servers:
- url: http://localhost:8000
  description: Local development
tags:
- name: auth
  description: 'Citizen sign-in: WhatsApp reverse-OTP request/poll and session refresh (US-01).'
- name: grievances
  description: Citizen complaint filing, review, and status tracking shared by the web portal (US-02 to
    US-08, US-10).
- name: official operations
  description: Department-scoped triage console for government staff (US-03 to US-07).
- name: whatsapp
  description: 'Meta WhatsApp Cloud API webhook: the transport for the WhatsApp bot channel (US-01, US-02,
    US-03, US-09, US-10).'
- name: health
  description: Liveness/readiness probes for deployment infrastructure. Not citizen- or official-facing.
- name: contacts
  description: Internal/ops read access to WhatsApp contacts. Requires X-API-Key; not part of any citizen-facing
    flow.
- name: messages
  description: Internal/ops read and send access to WhatsApp messages. Requires X-API-Key; not part of
    any citizen-facing flow.
- name: internal
  description: Development/demo-only endpoints not exposed to citizens or officials in production.
