openapi: 3.1.0
info:
  title: Jan Setu API
  version: 0.2.0
  description: 'Jan Setu is a civic complaint platform: citizens file complaints over a React web portal
    or a WhatsApp bot, both backed by this shared FastAPI service. This spec is generated directly from
    the live FastAPI route definitions (`app.openapi()`), then annotated with the user story each operation
    implements (`x-user-stories`, referencing the JAN-SETU smart user stories US-01..US-10) and with the
    non-2xx responses each handler actually raises.


    Two authentication schemes are in play:

    - **Citizen bearer token** (`Authorization: Bearer <access_token>`) issued by `/auth/*`, required
    by every `/api/grievances/*` route.

    - **Official bearer token** (`Authorization: Bearer <access_token>`) issued by `/api/official/auth/verify`,
    required by every other `/api/official/*` route and audience-scoped separately from citizen tokens.

    - **X-API-Key header**, required by the internal `/v1/contacts` and `/v1/messages*` routes.


    All endpoints also return `422` with FastAPI''s standard validation-error body on malformed request
    bodies/query params; that response is omitted per-operation below to avoid repeating it, but applies
    everywhere a request body or typed query parameter is present.'
paths:
  /health:
    get:
      tags:
      - health
      - internal
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
      description: Liveness probe. Returns 200 if the process is running; does not touch the database.
  /ready:
    get:
      tags:
      - health
      - internal
      summary: Ready
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Ready Ready Get
      description: Readiness probe. Runs `SELECT 1` against PostgreSQL and returns 200 only if it succeeds.
  /v1/contacts:
    get:
      tags:
      - contacts
      - internal
      summary: Get Contacts
      operationId: get_contacts_v1_contacts_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContactRead'
                title: Response Get Contacts V1 Contacts Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid X-API-Key header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '503':
          description: API_KEY is not configured outside development.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      security:
      - apiKeyAuth: []
      description: Lists stored WhatsApp contacts for internal debugging/ops. Requires the X-API-Key header.
  /v1/messages:
    get:
      tags:
      - messages
      - internal
      summary: Get Messages
      operationId: get_messages_v1_messages_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: wa_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Wa Id
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageRead'
                title: Response Get Messages V1 Messages Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid X-API-Key header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '503':
          description: API_KEY is not configured outside development.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      security:
      - apiKeyAuth: []
      description: Lists stored inbound/outbound WhatsApp messages, optionally filtered by wa_id. Requires
        the X-API-Key header.
  /v1/messages/text:
    post:
      tags:
      - messages
      - internal
      summary: Send Text Message
      operationId: send_text_message_v1_messages_text_post
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTextRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendTextResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid X-API-Key header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '503':
          description: API_KEY not configured outside development, or the WhatsApp client is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '502':
          description: WhatsApp Cloud API returned an error status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      security:
      - apiKeyAuth: []
      description: Sends a free-form WhatsApp text message via the Cloud API and stores the outbound record.
        Requires the X-API-Key header; only deliverable inside Meta's 24-hour customer-service window
        unless a template is used.
  /whatsapp/webhook:
    get:
      tags:
      - whatsapp
      summary: Verify Webhook
      operationId: verify_webhook_whatsapp_webhook_get
      parameters:
      - name: hub.mode
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Hub.Mode
      - name: hub.verify_token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Hub.Verify Token
      - name: hub.challenge
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Hub.Challenge
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '403':
          description: hub.verify_token does not match the configured value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-user-stories:
      - US-01
      - US-02
      - US-03
      - US-09
      - US-10
      description: 'Meta''s webhook subscription handshake: echoes back hub.challenge if hub.verify_token
        matches the configured WHATSAPP_VERIFY_TOKEN.'
    post:
      tags:
      - whatsapp
      summary: Receive Webhook
      operationId: receive_webhook_whatsapp_webhook_post
      parameters:
      - name: x-hub-signature-256
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Hub-Signature-256
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Receive Webhook Whatsapp Webhook Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: X-Hub-Signature-256 does not match the HMAC of the raw body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '400':
          description: Body is not valid JSON or is not a JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '503':
          description: WHATSAPP_APP_SECRET is not configured outside development.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-user-stories:
      - US-01
      - US-02
      - US-03
      - US-09
      - US-10
      security:
      - metaWebhookSignature: []
      description: Entry point for all inbound WhatsApp traffic. Verifies the X-Hub-Signature-256 HMAC,
        persists the raw event, and hands processing to a background task so a slow or failing pipeline
        never blocks Meta's delivery or triggers a retry.
  /auth/request-code:
    post:
      tags:
      - auth
      summary: Request Code
      operationId: request_code_auth_request_code_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCodeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestCodeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Too many verification/approval requests for this phone number in the last hour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-user-stories:
      - US-01
      description: Starts citizen sign-in. If the phone messaged the bot within the current service window,
        sends a one-tap WhatsApp approval instead of a reverse code; otherwise returns a code for the
        citizen to send to the bot. Rate-limited to `verification_max_per_hour` combined attempts per
        phone.
  /auth/status:
    get:
      tags:
      - auth
      summary: Auth Status
      operationId: auth_status_auth_status_get
      parameters:
      - name: verification_id
        in: query
        required: true
        schema:
          type: string
          title: Verification Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Unknown verification_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-user-stories:
      - US-01
      description: Polled by the web app while a reverse-code sign-in is pending. Issues an access token
        and sets the refresh-token cookie exactly once, on the first poll after the code is verified.
  /auth/approval-status:
    post:
      tags:
      - auth
      summary: Approval Status
      operationId: approval_status_auth_approval_status_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalStatusRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-user-stories:
      - US-01
      description: Polled equivalent of /auth/status for the WhatsApp one-tap approval flow; matches the
        challenge by id and the browser's nonce.
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh
      operationId: refresh_auth_refresh_post
      parameters:
      - name: Cookie
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cookie
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid/expired/revoked refresh token cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-user-stories:
      - US-01
      description: Rotates the httpOnly refresh_token cookie and issues a new access token. The old refresh
        token is revoked even when the call fails.
  /auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout_auth_logout_post
      parameters:
      - name: Cookie
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cookie
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Logout Auth Logout Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-user-stories:
      - US-01
      description: Revokes the current refresh token, if any, and clears the cookie. Always returns 200.
  /api/grievances/transcription-preview:
    post:
      tags:
      - grievances
      summary: Preview Transcription
      operationId: preview_transcription_api_grievances_transcription_preview_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_preview_transcription_api_grievances_transcription_preview_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionPreview'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '400':
          description: Audio exceeds the configured size limit or has a disallowed MIME type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-user-stories:
      - US-02
      security:
      - citizenBearerAuth: []
      description: Transcribes a standalone audio clip via Sarvam STT without creating or attaching it
        to a grievance, so the filing wizard can preview text before the citizen commits to it.
  /api/grievances/draft:
    post:
      tags:
      - grievances
      summary: Create Draft
      operationId: create_draft_api_grievances_draft_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_draft_api_grievances_draft_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrievanceDraftResponse'
        '422':
          description: Voice note metadata is missing, malformed, or does not match the number of uploaded
            clips.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '400':
          description: Account has no verified WhatsApp contact, an upload is invalid, or neither text
            nor voice notes were provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-user-stories:
      - US-02
      - US-03
      - US-10
      security:
      - citizenBearerAuth: []
      description: Creates a grievance from the web filing wizard (location, optional text/voice description,
        optional photo). Persists uploads, marks the grievance 'processing', and enqueues the async classification/geocoding/image-check
        pipeline job.
  /api/grievances/{grievance_id}/draft:
    get:
      tags:
      - grievances
      summary: Get Draft
      operationId: get_draft_api_grievances__grievance_id__draft_get
      parameters:
      - name: grievance_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Grievance Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrievanceDraftResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Grievance does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-user-stories:
      - US-03
      - US-10
      security:
      - citizenBearerAuth: []
      description: Fetches the current state of a grievance draft (classification, routing, flags) while
        the async pipeline is running or after it finishes, for the citizen review screen.
  /api/grievances/{grievance_id}/review:
    patch:
      tags:
      - grievances
      summary: Update Review
      operationId: update_review_api_grievances__grievance_id__review_patch
      parameters:
      - name: grievance_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Grievance Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrievanceReviewPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrievanceDraftResponse'
        '422':
          description: Unknown civic category or invalid asset scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Grievance does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-user-stories:
      - US-03
      - US-05
      - US-10
      security:
      - citizenBearerAuth: []
      description: Lets the citizen correct the AI-suggested category or asset scope, or answer a clarification
        question, before confirming. Submitting a correction or clarification re-queues a stronger re-extraction
        pass in the background.
  /api/grievances/{grievance_id}/photo:
    patch:
      tags:
      - grievances
      summary: Replace Photo
      operationId: replace_photo_api_grievances__grievance_id__photo_patch
      parameters:
      - name: grievance_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Grievance Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_replace_photo_api_grievances__grievance_id__photo_patch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrievanceDraftResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Grievance does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '400':
          description: Photo exceeds the configured size limit or has a disallowed MIME type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '502':
          description: Downstream image-consistency re-check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-user-stories:
      - US-04
      security:
      - citizenBearerAuth: []
      description: Replaces the attached evidence photo and synchronously re-runs the image-vs-description
        consistency check before returning.
  /api/grievances/{grievance_id}/confirm:
    post:
      tags:
      - grievances
      summary: Confirm Draft
      operationId: confirm_draft_api_grievances__grievance_id__confirm_post
      parameters:
      - name: grievance_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Grievance Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrievanceConfirmResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Grievance does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '400':
          description: Grievance is not currently awaiting_confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      x-user-stories:
      - US-06
      - US-07
      - US-10
      security:
      - citizenBearerAuth: []
      description: 'Finalizes a grievance that is awaiting_confirmation: routes it into the aggregation
        window (non-priority categories), straight to dispatch (priority categories), or straight to
        official review (redirect/needs-review dispositions) per the taxonomy routing policy. If a
        duplicate is found within the dedup radius/category during this step, the new grievance is
        merged into the existing one instead (`status: duplicate`, `duplicate_of_human_id` and the
        master''s updated `report_count` are returned) so the department gets one consolidated report
        per issue.'
  /api/grievances:
    get:
      tags:
      - grievances
      summary: List My Grievances
      operationId: list_my_grievances_api_grievances_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GrievanceSummary'
                title: Response List My Grievances Api Grievances Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
