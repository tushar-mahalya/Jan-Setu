name: Deploy (dev)

# Runs only after CI (ci.yml) finishes successfully on main, so a broken
# push never reaches the dev VM.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH deploy to OCI dev VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_DEV_HOST }}
          username: ${{ secrets.OCI_DEV_SSH_USER }}
          key: ${{ secrets.OCI_DEV_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/MAY2026-Team-050
            git fetch origin main
            git reset --hard origin/main
            # Explicit service list skips mailpit/tunnel (dev-only, not part
            # of this deployment) without needing a separate compose profile.
            docker compose up -d --build api worker frontend postgres
            docker compose exec -T api uv run alembic upgrade head
