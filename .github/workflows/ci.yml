name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save minutes and avoid stale results.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

  migrations:
    name: Migration check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jan_setu
          POSTGRES_USER: jan_setu_app
          POSTGRES_PASSWORD: jan_setu_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jan_setu_app -d jan_setu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: jan_setu
      POSTGRES_USER: jan_setu_app
      POSTGRES_PASSWORD: jan_setu_dev_password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply migrations to a clean database
        run: uv run alembic upgrade head

      - name: Check models match migrations (no drift)
        run: uv run alembic check

      # A broken downgrade() is otherwise only discovered during a rollback.
      - name: Check the downgrade path
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  api-image:
    name: API image (build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t jan-setu-api-ci .

      - name: Smoke test the image
        run: |
          docker run -d --rm --name jan-setu-api-ci -p 127.0.0.1:8000:8000 jan-setu-api-ci
          trap 'docker stop jan-setu-api-ci' EXIT
          ready=""
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null && { ready=1; break; }
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::API container never became ready; log follows"
            docker logs jan-setu-api-ci || true
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8000/health | grep -q '"status":"ok"'

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build production artifact
        working-directory: frontend
        env:
          VITE_ASSET_BASE: /portal/
          VITE_TILE_URL: https://tiles.example.test/{z}/{x}/{y}.png
        run: npm run build

      - name: Check production artifact
        working-directory: frontend
        run: |
          test -f dist/index.html
          grep -q '/portal/assets/' dist/index.html
          grep -R -q 'tiles.example.test' dist/assets

      - name: Validate Nginx configuration and response headers
        run: |
          docker build -t jan-setu-frontend-ci frontend
          # nginx resolves the "api" upstream at startup and aborts if unknown.
          docker run -d --rm --name jan-setu-frontend-ci --add-host api:127.0.0.1 \
            -p 127.0.0.1:8080:80 jan-setu-frontend-ci
          trap 'docker stop jan-setu-frontend-ci' EXIT
          ready=""
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8080/ >/dev/null && { ready=1; break; }
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::frontend container never became ready; nginx log follows"
            docker logs jan-setu-frontend-ci || true
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8080/deep/link | grep -q '<div id="root">'
          # From the image, not frontend/dist: different build, different hashes.
          asset=$(docker exec jan-setu-frontend-ci sh -c 'ls /usr/share/nginx/html/assets' | head -n 1)
          curl --fail --silent --head "http://127.0.0.1:8080/assets/$asset" | grep -qi 'Cache-Control: public, max-age=31536000, immutable'
          curl --fail --silent --head http://127.0.0.1:8080/ | grep -qi 'Cache-Control: no-cache'

  ci-success:
    name: CI success
    if: always()
    needs: [lint, test, migrations, api-image, e2e, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All checks passed
        run: echo "lint, test, migration, and frontend checks all passed"
