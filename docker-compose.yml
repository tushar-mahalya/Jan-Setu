name: jan-setu

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jan_setu}
      POSTGRES_USER: ${POSTGRES_USER:-jan_setu_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jan_setu_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    image: jan-setu-api:local
    command: uvicorn jan_setu.main:app --host 0.0.0.0 --port 8000
    # Load the full .env so container settings never drift from local dev; only
    # override what must differ inside the compose network (the DB hostname).
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - services

  worker:
    build: .
    image: jan-setu-api:local
    command: jan-setu-worker
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - services

  mailhog:
    image: mailhog/mailhog
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    restart: unless-stopped
    profiles:
      - services

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 --url http://api:8000
    depends_on:
      - api
    profiles:
      - tunnel

volumes:
  postgres_data:
  uploads:
